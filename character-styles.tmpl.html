<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Styles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Patrick+Hand&family=Patrick+Hand+SC&display=swap" rel="stylesheet">
<style>
  :root { --paper: #fcf9f3; --hilite: #ffeeb8; --ink: #2a2724; --deep-teal: #094854;
          --page-bg: #efeae0; --page-fg: #2a2a2a; --muted: #6b665c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page-bg: #1c1b19; --page-fg: #ece7dc; --muted: #a39d90; }
  }
  :root[data-theme="dark"] { --page-bg: #1c1b19; --page-fg: #ece7dc; --muted: #a39d90; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-bg); color: var(--page-fg); font: 16px/1.5 system-ui, sans-serif; padding: 24px 16px 48px; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-family: "Luckiest Guy", cursive; font-weight: 400; font-size: 40px; letter-spacing: 1px; margin: 0 0 4px;
       display: inline-block; padding: 4px 14px 0; background: var(--hilite); color: #1b1b1b; border-radius: 4px 12px 6px 10px; }
  .sub { color: var(--muted); margin: 10px 0 20px; font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--paper); color: var(--ink); border-radius: 10px; padding: 16px 18px 18px;
          box-shadow: 0 2px 0 rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.14); }
  .card h2 { font-family: "Patrick Hand SC", cursive; font-weight: 400; font-size: 30px; color: var(--deep-teal); margin: 0; }
  .card p { font-family: "Patrick Hand", cursive; font-size: 19px; line-height: 1.3; margin: 8px 0 0; color: #3a3631; }
  .pick { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: center; margin-bottom: 16px; outline: 3px solid var(--hilite); }
  @media (max-width: 900px) { .pick { grid-template-columns: 1fr; } }
  .pick .stage { max-width: 520px; }
  .tag { display: inline-block; font-family: "Patrick Hand SC", cursive !important; background: var(--hilite); padding: 0 10px; border-radius: 4px; }
  .stage svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wob" filterUnits="userSpaceOnUse" x="-50" y="-50" width="700" height="500">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <filter id="wob-lite" filterUnits="userSpaceOnUse" x="-50" y="-50" width="700" height="500">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="5"/><feDisplacementMap in="SourceGraphic" scale="1.8"/></filter>
    <!-- the speech-bubble wobble from slide v1, turned up a little so it still shows on chunkier outlines -->
    <filter id="wob-bubble" filterUnits="userSpaceOnUse" x="-50" y="-50" width="700" height="500">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="4.5"/></filter>
    <filter id="wash" filterUnits="userSpaceOnUse" x="-50" y="-50" width="700" height="500">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="8" result="d"/><feGaussianBlur in="d" stdDeviation="1.2"/></filter>
  </defs>
</svg>
<div class="wrap">
  <h1>THREE CHARACTER STYLES</h1>
  <p class="sub">The same two people drawn three chunkier ways: a learner with headphones and a book, and an explainer pointing. The fonts and colours are the ones already agreed.</p>
  {{BLEND}}
  <div class="grid">
{{CARDS}}
  </div>
</div>
</body>
</html>
